[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cod-doc"
version = "1.1.0"
description = "Context Orchestrator for Documentation — autonomous multi-project documentation agent"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Typing :: Typed",
]
dependencies = [
    "openai>=1.50.0",
    "chromadb>=0.5.0",
    "textual>=0.80.0",
    "mcp>=1.0.0,<2",  # PR#5: верхний пин — mcp 2.x ломает совместимость
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pyyaml>=6.0",
    "rich>=13.7",
    "click>=8.1",
    "gitpython>=3.1",
    "pathspec>=0.12",  # OBI-030 repo_index_service .gitignore matching
    "jinja2>=3.1",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "python-ulid>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",  # PR#5: гейт из CLAUDE.md зовёт --timeout=120
    "hypothesis>=6.100",
    # ADO-070: верхняя граница на minor — линтер без пина это «движущийся гейт»:
    # CI ставил ruff заново на каждый прогон и приносил новые правила (так
    # приехали 10×RUF036 в красный CI), пока локальный venv стоял на старой
    # версии и молчал. Поднимать границу — осознанным коммитом с прогоном.
    "ruff>=0.16.5,<0.17",
    "mypy>=1.11",
    "types-PyYAML>=6.0",  # PR#5: стабы для mypy strict
    "pre-commit>=3.8",
]
# COD-043: opt-in local embeddings backend. Pulls torch (~200 MB on first
# install) and sentence-transformers. Use when offline or when the OpenAI
# embeddings cost is unacceptable.
embeddings-local = [
    "sentence-transformers>=3.0",
]

[project.scripts]
cod-doc = "cod_doc.cli:main"
cod-doc-mcp = "cod_doc.mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cod_doc*"]

[tool.setuptools.package-data]
"cod_doc" = [
    "tui/*.tcss",
    "templates/*.j2",
    "templates/web/*.html",
    "templates/web/_layout/*.html",
    "templates/web/_frag/*.html",
    "templates/web/project/*.html",
    "templates/web/standards/*.html",
    "static/*.css",
    "static/*.js",
    "static/css/*.css",
    "skills/**/*.md",
    "py.typed",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "TCH",  # type-checking imports
    "RUF",  # ruff-specific
    # --- quality policy 2026-08-25 (docs/system/standards/code-quality.md) ---
    "ANN",  # mandatory annotations; ANN401 = no bare `Any` in signatures
    "C901", # KISS: cyclomatic complexity ceiling (see [lint.mccabe])
    "PLR2004", # no magic numbers in comparisons (code only; tests exempt)
    "RET",  # return discipline (no assign-then-return, etc.)
    "PERF", # obvious perf anti-patterns (manual list building, etc.)
    "PTH",  # pathlib over os.path — codebase is already clean, keep it so
]

[tool.ruff.lint.mccabe]
# Target is 10; 15 is the hard ceiling. Existing offenders are ratchet-listed
# below and must only shrink — never raise this number to admit new code.
max-complexity = 15

[tool.ruff.lint.flake8-annotations]
# `**kwargs: Any` passthrough is a legitimate pattern (event payloads, click);
# bare `param: Any` is not — type it properly or use `object`.
allow-star-arg-any = true
mypy-init-return = true

[tool.ruff.lint.isort]
known-first-party = ["cod_doc"]

[tool.ruff.lint.flake8-type-checking]
# FastAPI / Pydantic / SQLAlchemy resolve type hints at runtime, so imports of
# their base classes and decorators must stay outside `TYPE_CHECKING` blocks.
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
    "sqlalchemy.orm.DeclarativeBase",
]
runtime-evaluated-decorators = [
    "fastapi.APIRouter.get",
    "fastapi.APIRouter.post",
    "fastapi.APIRouter.put",
    "fastapi.APIRouter.patch",
    "fastapi.APIRouter.delete",
]

[tool.ruff.lint.per-file-ignores]
# API surface uses Pydantic schemas as parameter types — those need to stay
# at runtime regardless of TYPE_CHECKING heuristics.
"cod_doc/api/routes.py" = ["TC001", "TC002", "TC003"]
"cod_doc/api/webhooks.py" = ["TC001", "TC002", "TC003"]
"cod_doc/api/deps.py" = ["TC001", "TC002", "TC003"]
"cod_doc/api/web/*.py" = ["TC001", "TC002", "TC003"]
# cod_doc contains intentional Russian text, complex docstrings, and UI labels.
# RUF001/002/003 are false positives on Cyrillic text.
# E501 violations are primarily unavoidable long docstrings/signatures.
"cod_doc/**/*.py" = ["RUF001", "RUF002", "RUF003", "E501"]
# Test modules contain intentional Russian strings (test data, docstrings)
# that trip RUF001/002/003 ambiguous-unicode checks, plus complex assertions.
# ANN/PLR2004 exempt: literals ARE the test data, and mypy does not check
# tests either — annotation pressure there buys nothing.
"tests/**/*.py" = ["RUF001", "RUF002", "RUF003", "E501", "ANN", "PLR2004", "PERF"]

# ── RATCHET (2026-08-25): существующие нарушители на момент включения ──
# Список может только уменьшаться. Починил файл — удали строку. Новые файлы
# в список НЕ добавляются: новая запись здесь = отклонение политики, а не фикс.
# Burn-down трекается docs/system/standards/code-quality.md §3.
# ANN401 — bare `Any` в сигнатурах (40 мест на момент включения):
"cod_doc/agent/adapters/anthropic.py" = ["ANN401"]
"cod_doc/agent/adapters/openai_compat.py" = ["ANN401"]
"cod_doc/agent/adapters/registry.py" = ["ANN401"]
"cod_doc/agent/tools.py" = ["ANN401"]
"cod_doc/api/web/fragments/_shared.py" = ["ANN401"]
"cod_doc/api/web/fragments/sections.py" = ["ANN401"]
"cod_doc/api/web/fragments/tasks_fields.py" = ["ANN401"]
"cod_doc/cli/cmd_audit.py" = ["ANN401", "PERF401"]
"cod_doc/core/reindex.py" = ["ANN401", "PERF401"]
"cod_doc/infra/sql_helpers.py" = ["ANN401"]
"cod_doc/mcp/tools/_db.py" = ["ANN401"]
"cod_doc/mcp/tools/link_tools.py" = ["ANN401"]
"cod_doc/mcp/tools/revision_tools.py" = ["ANN401"]
"cod_doc/mcp/tools/routine_tools.py" = ["ANN401"]
"cod_doc/mcp/tools/task_doc_tools.py" = ["ANN401"]
"cod_doc/services/ai_generate.py" = ["ANN401"]
"cod_doc/services/import_service.py" = ["ANN401"]
"cod_doc/services/plan_service/export.py" = ["ANN401", "PERF401"]
# PLR2004 — магические числа (39 мест на момент включения):
"cod_doc/agent/retry.py" = ["PLR2004"]
"cod_doc/agent/skill_matcher.py" = ["PLR2004"]
"cod_doc/api/web/pages/_helpers.py" = ["PLR2004"]
"cod_doc/api/web/pages/adr.py" = ["PLR2004", "PERF401"]
"cod_doc/api/web/pages/routines.py" = ["PLR2004"]
"cod_doc/api/web/pages/run.py" = ["PLR2004"]
"cod_doc/cli/adr/cmd_show.py" = ["PLR2004", "PERF401"]
"cod_doc/cli/story/cmd_list.py" = ["PLR2004"]
"cod_doc/mcp/tools/agent_tools.py" = ["PLR2004"]
"cod_doc/services/agent_service.py" = ["PLR2004"]
"cod_doc/services/commit_link_service.py" = ["PLR2004"]
"cod_doc/services/metrics_service.py" = ["PLR2004"]
"cod_doc/services/model_catalog.py" = ["PLR2004"]
"cod_doc/services/nav_service.py" = ["PLR2004"]
"cod_doc/services/sensitivity_scanner.py" = ["PLR2004"]
"cod_doc/services/skill_service.py" = ["PLR2004"]
"cod_doc/services/task_service.py" = ["PLR2004"]
"cod_doc/services/validation/advisory.py" = ["PLR2004"]
"cod_doc/tui/screens/wizard/screen.py" = ["PLR2004"]
# C901 — сложность > 15 (14 функций на момент включения):
"cod_doc/api/web/markdown.py" = ["C901"]
"cod_doc/api/web/pages/stories.py" = ["C901", "PERF401"]
"cod_doc/mcp/tools/adr_tools.py" = ["C901"]
"cod_doc/mcp/tools/doc_tools.py" = ["C901"]
"cod_doc/mcp/tools/story_tools.py" = ["C901"]
"cod_doc/services/adr_service.py" = ["C901", "PERF401"]
"cod_doc/services/link_service/rename_cascade.py" = ["C901"]
"cod_doc/services/link_service/resolver.py" = ["C901"]
"cod_doc/services/link_service/semantic.py" = ["C901"]
"cod_doc/services/plan_service/graph.py" = ["C901", "PERF401"]
# PERF401 — ручной list-comprehension (25 мест, авто-фикс ruff счёл небезопасным):
"cod_doc/api/web/pages/comments.py" = ["PERF401"]
"cod_doc/api/web/pages/docs.py" = ["PERF401"]
"cod_doc/api/web/pages/project.py" = ["PERF401"]
"cod_doc/api/web/pages/revisions.py" = ["PERF401"]
"cod_doc/api/web/pages/tasks.py" = ["PERF401"]
"cod_doc/logging_config.py" = ["PERF401"]
"cod_doc/mcp/tools/legacy_agent_tools.py" = ["PERF401"]
"cod_doc/services/context_service.py" = ["PERF401"]
"cod_doc/services/repo_index_service.py" = ["PERF401"]
# Файлы сразу в нескольких списках:
"cod_doc/agent/orchestrator.py" = ["ANN401", "PLR2004", "C901"]
"cod_doc/mcp/tools/context_tools.py" = ["PLR2004", "C901"]
"cod_doc/mcp/tools/plan_tools.py" = ["ANN401", "C901"]
"cod_doc/mcp/tools/task_tools.py" = ["ANN401", "C901"]

[tool.mypy]
# ADO-097: 3.13 — единственная поддерживаемая версия (`requires-python >=3.13`),
# матрица CI гоняет её же. До этого здесь стоял 3.12 вынужденно: numpy приезжает
# транзитивно (openai._extras.numpy_proxy → numpy), с 2.5 его стабы написаны на
# PEP 695, и под `python_version = "3.11"` mypy обрывал проверку целиком на
# `Type statement is only supported in Python 3.12+`. Вместе с 3.11 ушла и
# расходившаяся с ним версия проверки типов.
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
# quality policy 2026-08-25: dead code is a defect, not a style choice.
warn_unreachable = true
# `Any` must not leak in through untyped third-party imports.
disallow_any_unimported = true

[[tool.mypy.overrides]]
module = ["anthropic", "sentence_transformers", "yaml"]
ignore_missing_imports = true
