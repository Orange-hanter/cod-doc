[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cod-doc"
version = "1.1.0"
description = "Context Orchestrator for Documentation — autonomous multi-project documentation agent"
readme = "docs/cod-doc-guide.md"
license = "MIT"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Typing :: Typed",
]
dependencies = [
    "openai>=1.50.0",
    "chromadb>=0.5.0",
    "textual>=0.80.0",
    "mcp>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pyyaml>=6.0",
    "rich>=13.7",
    "click>=8.1",
    "gitpython>=3.1",
    "pathspec>=0.12",  # OBI-030 repo_index_service .gitignore matching
    "jinja2>=3.1",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "python-ulid>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "ruff>=0.8",
    "mypy>=1.11",
    "pre-commit>=3.8",
]
# COD-043: opt-in local embeddings backend. Pulls torch (~200 MB on first
# install) and sentence-transformers. Use when offline or when the OpenAI
# embeddings cost is unacceptable.
embeddings-local = [
    "sentence-transformers>=3.0",
]

[project.scripts]
cod-doc = "cod_doc.cli:main"
cod-doc-mcp = "cod_doc.mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cod_doc*"]

[tool.setuptools.package-data]
"cod_doc" = [
    "tui/*.tcss",
    "templates/*.j2",
    "templates/web/*.html",
    "templates/web/_layout/*.html",
    "templates/web/_frag/*.html",
    "templates/web/project/*.html",
    "templates/web/standards/*.html",
    "static/*.css",
    "static/*.js",
    "static/css/*.css",
    "skills/**/*.md",
    "py.typed",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "TCH",  # type-checking imports
    "RUF",  # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["cod_doc"]

[tool.ruff.lint.flake8-type-checking]
# FastAPI / Pydantic / SQLAlchemy resolve type hints at runtime, so imports of
# their base classes and decorators must stay outside `TYPE_CHECKING` blocks.
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
    "sqlalchemy.orm.DeclarativeBase",
]
runtime-evaluated-decorators = [
    "fastapi.APIRouter.get",
    "fastapi.APIRouter.post",
    "fastapi.APIRouter.put",
    "fastapi.APIRouter.patch",
    "fastapi.APIRouter.delete",
]

[tool.ruff.lint.per-file-ignores]
# API surface uses Pydantic schemas as parameter types — those need to stay
# at runtime regardless of TYPE_CHECKING heuristics.
"cod_doc/api/routes.py" = ["TC001", "TC002", "TC003"]
"cod_doc/api/webhooks.py" = ["TC001", "TC002", "TC003"]
"cod_doc/api/deps.py" = ["TC001", "TC002", "TC003"]
"cod_doc/api/web/*.py" = ["TC001", "TC002", "TC003"]
# cod_doc contains intentional Russian text, complex docstrings, and UI labels.
# RUF001/002/003 are false positives on Cyrillic text.
# E501 violations are primarily unavoidable long docstrings/signatures.
"cod_doc/**/*.py" = ["RUF001", "RUF002", "RUF003", "E501"]
# Test modules contain intentional Russian strings (test data, docstrings)
# that trip RUF001/002/003 ambiguous-unicode checks, plus complex assertions.
"tests/**/*.py" = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["anthropic", "yaml"]
ignore_missing_imports = true
