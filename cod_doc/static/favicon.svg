<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="cod-doc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#2f81f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#cod-doc-bg)"/>

  <!-- Document corner fold (subtle) -->
  <path d="M44 8 L56 20 L56 22 L44 22 Z"
        fill="#ffffff" opacity="0.18"/>
  <path d="M44 8 L44 22 L56 22"
        fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>

  <!-- Three structured "lines" — abstract doc content -->
  <rect x="14" y="14" width="22" height="3" rx="1.5" fill="#ffffff" opacity="0.85"/>
  <rect x="14" y="22" width="16" height="2.5" rx="1.25" fill="#ffffff" opacity="0.55"/>

  <!-- Code brackets "</>" — the COD half -->
  <g fill="none" stroke="#ffffff" stroke-width="3.2"
     stroke-linecap="round" stroke-linejoin="round"
     filter="url(#glow)">
    <path d="M22 40 L14 46 L22 52"/>
    <path d="M42 40 L50 46 L42 52"/>
    <path d="M36 36 L28 56"/>
  </g>
</svg>
