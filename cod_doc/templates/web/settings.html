{% extends "base.html" %}
{% block title %}Settings — COD-DOC{% endblock %}
{% block content %}
<nav class="crumbs"><a href="/">Projects</a> / <span>Settings</span></nav>

<h1>Settings</h1>

<form method="post" action="/settings" class="settings-form">
  <fieldset>
    <legend>LLM</legend>
    <label class="field">
      <span class="label">API key</span>
      <input type="password" name="api_key"
             placeholder="{% if config.api_key_set %}{{ config.api_key_masked }} (оставь пустым — не менять){% else %}sk-…{% endif %}">
      <small class="muted">
        {% if config.api_key_set %}
          Ключ установлен ({{ config.api_key_masked }}). Пустое поле — оставить как есть.
          Чтобы удалить — введи дефис&nbsp;«−».
        {% else %}
          Ключ не установлен. Перейди на OpenRouter за ключом.
        {% endif %}
      </small>
    </label>
    <label class="field">
      <span class="label">Base URL</span>
      <input type="text" name="base_url" value="{{ config.base_url }}" required>
    </label>
    <label class="field">
      <span class="label">Model preset</span>
      <select id="model-preset" onchange="syncModelPreset(this)">
        {% for m in model_catalog %}
          <option value="{{ m.model_id }}"
                  data-notes="{{ m.notes }}"
                  {% if config.model == m.model_id %}selected{% endif %}>
            {{ m.describe }}
          </option>
        {% endfor %}
        <option value="__custom__" {% if model_is_custom %}selected{% endif %}>
          Custom — type model ID below
        </option>
      </select>
      <small class="muted" id="model-notes">
        {% for m in model_catalog %}{% if config.model == m.model_id %}{{ m.notes }}{% endif %}{% endfor %}
      </small>
    </label>
    <label class="field">
      <span class="label">Model ID</span>
      <input type="text" id="model-id" name="model" value="{{ config.model }}" required>
      <small class="muted">
        OpenRouter route slug (e.g. <code>anthropic/claude-sonnet-4-6</code>).
        Pricing/context above are informational — provider invoice wins.
      </small>
    </label>
    <script>
      function syncModelPreset(select) {
        const input = document.getElementById('model-id');
        const notes = document.getElementById('model-notes');
        if (select.value === '__custom__') {
          input.focus();
          notes.textContent = 'Введи custom model ID вручную.';
        } else {
          input.value = select.value;
          const opt = select.options[select.selectedIndex];
          notes.textContent = opt.dataset.notes || '';
        }
      }
    </script>
    <label class="field">
      <span class="label">Lite model <span class="muted-tiny">(AI autocomplete)</span></span>
      <input type="text" name="lite_model" value="{{ config.lite_model }}"
             placeholder="e.g. openai/gpt-4o-mini — defaults to main model if empty">
      <small class="muted">
        Used for fast UI helpers (doc suggest, quick meta-fill). Cheap, low-latency.
        Leave empty to use the main model.
      </small>
    </label>
    <label class="field">
      <span class="label">Max tokens (global)</span>
      <input type="number" name="max_tokens" value="{{ config.max_tokens }}" min="1" required>
      <small class="muted">
        Default cap for agent steps and improve-text. Doc generation uses the two budgets below instead.
      </small>
    </label>
    <label class="field">
      <span class="label">Doc gen — heavy (architecture / module-spec)</span>
      <input type="number" name="doc_max_tokens_heavy"
             value="{{ config.doc_max_tokens_heavy }}" min="1024" step="1024" required>
      <small class="muted">
        Output budget for deep technical docs. 64K is comfortable for Deepseek V3 / Claude Sonnet 4.6;
        raise to 100K+ if your model supports it and you want maximum depth.
      </small>
    </label>
    <label class="field">
      <span class="label">Doc gen — default (vision / guide / standard / other)</span>
      <input type="number" name="doc_max_tokens_default"
             value="{{ config.doc_max_tokens_default }}" min="1024" step="1024" required>
      <small class="muted">
        Output budget for all other doc types. 16K covers a thorough multi-section doc.
      </small>
    </label>
    <label class="field">
      <span class="label">Embedding backend</span>
      <select name="embedding_backend">
        <option value="openai"
                {% if config.embedding_backend == "openai" %}selected{% endif %}>
          OpenAI-compatible /embeddings (uses API key)
        </option>
        <option value="openrouter"
                {% if config.embedding_backend == "openrouter" %}selected{% endif %}>
          OpenRouter (dedicated key, supports dimensions)
        </option>
        <option value="local"
                {% if config.embedding_backend == "local" %}selected{% endif %}>
          Local sentence-transformers (CPU, no API key)
        </option>
      </select>
      <small class="muted">
        <code>local</code> requires the optional extra:
        <code>pip install 'cod-doc[embeddings-local]'</code>.
      </small>
    </label>
    <label class="field">
      <span class="label">Embedding model</span>
      <input type="text" name="embedding_model" value="{{ config.embedding_model }}" required>
      <small class="muted">
        For <code>openai</code>/<code>openrouter</code>: a route like
        <code>openai/text-embedding-ada-002</code> or
        <code>qwen/qwen3-embedding-8b</code>. For <code>local</code>:
        a sentence-transformers id like <code>all-MiniLM-L6-v2</code>.
      </small>
    </label>
    <label class="field">
      <span class="label">Embedding API key</span>
      <input type="password" name="embedding_api_key"
             placeholder="{% if config.embedding_api_key_set %}{{ config.embedding_api_key_masked }}{% else %}not set{% endif %}">
      <small class="muted">
        Separate from the LLM key: <code>openrouter</code> does <b>not</b> inherit it.
        Empty = keep current; type <code>-</code> to delete.
      </small>
    </label>
    <label class="field">
      <span class="label">Embedding base URL</span>
      <input type="text" name="embedding_base_url" value="{{ config.embedding_base_url }}"
             placeholder="https://openrouter.ai/api/v1">
      <small class="muted">
        Empty = LLM base URL for <code>openai</code>, OpenRouter for <code>openrouter</code>.
      </small>
    </label>
    <label class="field">
      <span class="label">Embedding dimensions</span>
      <input type="number" name="embedding_dimensions" min="1"
             value="{{ config.embedding_dimensions }}" placeholder="native">
      <small class="muted">
        Matryoshka truncation on the provider side (e.g. 2048 for
        <code>qwen/qwen3-embedding-8b</code>). Changing it makes the existing
        collection incompatible — run <code>cod-doc embed reset</code>.
      </small>
    </label>
    <label class="field">
      <span class="label">Embedding batch size</span>
      <input type="number" name="embedding_batch_size" min="1"
             value="{{ config.embedding_batch_size }}">
    </label>
  </fieldset>

  <fieldset>
    <legend>Agent</legend>
    <label class="field">
      <span class="label">Max iterations</span>
      <input type="number" name="max_iterations" value="{{ config.max_iterations }}" min="1" required>
    </label>
    <label class="field">
      <span class="label">Daemon interval (sec)</span>
      <input type="number" name="agent_interval" value="{{ config.agent_interval }}" min="5" required>
    </label>
    <label class="field-checkbox">
      <input type="checkbox" name="auto_commit"{% if config.auto_commit %} checked{% endif %}>
      <span>Auto-commit after task</span>
    </label>
    <label class="field-checkbox">
      <input type="checkbox" name="agent_enabled"{% if config.agent_enabled %} checked{% endif %}>
      <span>Autonomous agent enabled</span>
    </label>
    <small class="muted field-hint">
      Если снять галку — агент не запустится при следующем старте контейнера.
      Для немедленной остановки используй кнопку <strong>Stop</strong> на главной странице.
    </small>
  </fieldset>

  <div class="form-actions">
    <button type="submit">Save</button>
  </div>
</form>
{% endblock %}
