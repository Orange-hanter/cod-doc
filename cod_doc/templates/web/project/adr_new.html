{% extends "base.html" %}
{% block title %}New ADR · {{ project.name }} — COD-DOC{% endblock %}
{% block content %}
<nav class="crumbs">
  <a href="/">Projects</a> /
  <a href="/p/{{ project.name }}">{{ project.name }}</a> /
  <a href="/p/{{ project.name }}/adr">ADRs</a> /
  <span>New</span>
</nav>

{% with slug=project.name, active="adr" %}{% include "_layout/project_tabs.html" %}{% endwith %}

<header class="page-header">
  <div><h1>🏛️ New ADR</h1></div>
</header>

<form method="post" action="{{ form_action }}" class="settings-form">
    <label class="field">
      <span class="label">Title (required)</span>
      <input name="title" required autofocus placeholder="e.g. Use SQLite for local-first deployment">
    </label>

    <div class="adr-form-row">
      <label class="field">
        <span class="label">Status</span>
        <select name="status">
          {% for s in status_options %}
            <option value="{{ s }}" {% if s == default_status %}selected{% endif %}>{{ s }}</option>
          {% endfor %}
        </select>
      </label>
      <label class="field">
        <span class="label">Decided at (optional)</span>
        <input name="decided_at" type="date">
      </label>
      <label class="field">
        <span class="label">Explicit ADR id (optional, otherwise auto-allocated)</span>
        <input name="adr_id" placeholder="ADR-NNN" pattern="^ADR-\d{3}$">
      </label>
    </div>

    <label class="field">
      <span class="label">Context — what problem are we solving?</span>
      <textarea name="context" rows="4"></textarea>
    </label>

    <label class="field">
      <span class="label">Decision — what did we choose?</span>
      <textarea name="decision" rows="4"></textarea>
    </label>

    <label class="field">
      <span class="label">Alternatives considered</span>
      <textarea name="alternatives" rows="3"></textarea>
    </label>

    <label class="field">
      <span class="label">Consequences (+ pros / − cons)</span>
      <textarea name="consequences" rows="3"></textarea>
    </label>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Create ADR</button>
      <a href="/p/{{ project.name }}/adr" class="btn">Cancel</a>
    </div>
</form>
{% endblock %}
