{# Task detail body — shared by the task page and the peek sheet (WUI-001).
   No <script> here: the sheet injects this markup into a live page, and htmx
   would run any script once per opening. #}
{% include "_frag/task_head.html" %}

{# ── BODY (2-col): content | deps sidebar ──────────────────────────── #}
<div class="task-layout">
  <main class="task-content">
    {#- ADO-148: итог закрытия — отчёт «что сделано», отдельно от исходной
        постановки (description). Источник — reason закрывающей ревизии. #}
    {% if completion %}
      <section class="task-card task-summary-card">
        <header class="task-card-header">
          <h2>Итог</h2>
          <span class="muted-tiny">{{ completion.author }} · <span title="{{ completion.at | ts_tooltip }}">{{ completion.at | short_datetime }}</span></span>
        </header>
        <div class="doc-body">{{ completion.summary_html | safe }}</div>
      </section>
    {% endif %}
    {% with field="description", label="Description", raw=task.description, html=task.description_html %}
      {% include "_frag/task_field_view.html" %}
    {% endwith %}
    {% with field="acceptance", label="Acceptance criteria", raw=task.acceptance, html=task.acceptance_html %}
      {% include "_frag/task_field_view.html" %}
    {% endwith %}
    {% if affected_files %}
      <section class="task-card task-files-card">
        <header class="task-card-header">
          <h2>Файлы <span class="count-chip">{{ affected_files | length }}</span></h2>
          <span class="muted-tiny">affects_files</span>
        </header>
        <ul class="task-files">
          {% for f in affected_files %}
            <li class="mono">
              {%- if f.url %}<a href="{{ f.url }}" target="_blank" rel="noopener">{{ f.path }}</a>
              {%- else %}{{ f.path }}{% endif -%}
            </li>
          {% endfor %}
        </ul>
      </section>
    {% endif %}
  </main>

  <aside class="task-deps">
    <section class="task-card task-deps-card">
      <header class="task-card-header">
        <h2>Blocked by <span class="count-chip">{{ forward | length }}</span></h2>
        <span class="muted-tiny">↑ must complete BEFORE</span>
      </header>
      {% if forward %}
        <ul class="dep-list">
          {% for e in forward %}
            <li class="dep-item">
              <span class="dep-depth" title="depth {{ e.depth }}">{{ e.depth }}</span>
              <span class="badge badge-{{ e.status }}">{{ e.status }}</span>
              <a href="/p/{{ project.name }}/tasks/{{ e.task_id }}" class="dep-link" data-peek>
                <span class="mono dep-id">{{ e.task_id }}</span>
                <span class="dep-title">{{ e.title }}</span>
              </a>
            </li>
          {% endfor %}
        </ul>
      {% else %}
        <p class="empty-hint"><em>Зависимостей нет — задача готова к старту.</em></p>
      {% endif %}
    </section>

    <section class="task-card task-deps-card">
      <header class="task-card-header">
        <h2>Unblocks <span class="count-chip">{{ reverse | length }}</span></h2>
        <span class="muted-tiny">↓ depends on this</span>
      </header>
      {% if reverse %}
        <ul class="dep-list">
          {% for e in reverse %}
            <li class="dep-item">
              <span class="dep-depth" title="depth {{ e.depth }}">{{ e.depth }}</span>
              <span class="badge badge-{{ e.status }}">{{ e.status }}</span>
              <a href="/p/{{ project.name }}/tasks/{{ e.task_id }}" class="dep-link" data-peek>
                <span class="mono dep-id">{{ e.task_id }}</span>
                <span class="dep-title">{{ e.title }}</span>
              </a>
            </li>
          {% endfor %}
        </ul>
      {% else %}
        <p class="empty-hint"><em>— не блокирует никаких задач.</em></p>
      {% endif %}
    </section>
  </aside>
</div>

{# ── AI TRACE (full-width) ─────────────────────────────────────────── #}
<section class="task-card task-trace">
  <header class="task-card-header">
    <h2>AI trace <span class="count-chip">{{ trace_totals.calls }}</span></h2>
    {% if trace_totals.calls %}
      <span class="muted-tiny">
        ∑ {{ trace_totals.input_tokens }} in / {{ trace_totals.output_tokens }} out tok
        · {{ trace_totals.duration_ms }} ms
      </span>
    {% endif %}
  </header>
  {% if trace %}
    <div class="table-scroll">
    <table class="grid task-trace-table">
      <thead>
        <tr>
          <th class="task-col-when">When</th>
          <th>Model</th>
          <th>Kind</th>
          <th class="num">In tok</th>
          <th class="num">Out tok</th>
          <th class="num">Duration</th>
          <th>Tools</th>
          <th>Error</th>
        </tr>
      </thead>
      <tbody>
        {% for t in trace %}
          <tr {% if t.error %}class="trace-err"{% endif %}>
            <td class="muted mono task-col-when" title="{{ t.ts | ts_tooltip }}">{{ t.ts | short_datetime }}</td>
            <td class="mono">{{ t.model }}</td>
            <td>{{ t.kind }}</td>
            <td class="num">{{ t.input_tokens }}</td>
            <td class="num">{{ t.output_tokens }}</td>
            <td class="num">{{ t.duration_ms }} ms</td>
            <td>
              {% if t.tool_calls %}
                <span class="muted-tiny">
                  {{ t.tool_calls | length }} call{% if t.tool_calls | length != 1 %}s{% endif %}:
                </span>
                {% for tc in t.tool_calls %}
                  <code>{{ tc.name or tc.tool or "?" }}</code>{% if not loop.last %}, {% endif %}
                {% endfor %}
              {% else %}
                <span class="muted-tiny">—</span>
              {% endif %}
            </td>
            <td class="diff-preview">
              {% if t.error %}<span class="warn">{{ t.error }}</span>{% endif %}
            </td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
    </div>
  {% else %}
    <p class="empty-hint"><em>Ещё не было вызовов ИИ для этой задачи.</em></p>
  {% endif %}
</section>

{# ── HISTORY (full-width) ─────────────────────────────────────────── #}
<section class="task-card task-history">
  <header class="task-card-header">
    <h2>Revision history <span class="count-chip">{{ history | length }}</span></h2>
    {% if history %}
      <a class="muted-tiny"
         href="/p/{{ project.name }}/revisions?entity_kind=task">
        all task revisions →
      </a>
    {% endif %}
  </header>
  {% if history %}
    <div class="table-scroll">
    <table class="grid task-history-table">
      <thead>
        <tr>
          <th>Revision</th>
          <th>Author</th>
          <th class="task-col-when">At</th>
          <th>Reason</th>
          <th>Diff (first line)</th>
        </tr>
      </thead>
      <tbody>
        {% for r in history %}
          <tr>
            <td class="mono">{{ r.revision_id }}</td>
            <td>{{ r.author }}</td>
            <td class="muted task-col-when" title="{{ r.at | ts_tooltip }}">{{ r.at | short_datetime }}</td>
            <td>{{ r.reason }}</td>
            <td class="mono diff-preview"><span class="cell-clamp" title="{{ r.diff_first_line }}">{{ r.diff_first_line }}</span></td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
    </div>
  {% else %}
    <p class="empty-hint"><em>Ревизий по этой задаче пока нет.</em></p>
  {% endif %}
</section>
{% include "_frag/linked_questions.html" %}
