name: PR Review (AI)

# Ревью PR движком ai-reviewer (MoA: специалисты → агрегатор → верификатор).
# Итог — один «липкий» комментарий плюс inline-треды; экспорт находок уходит
# артефактом `pr-review-export-<PR>`, его забирает
# `cod-doc ingest ai_review --from-pr <PR>` (cod_doc/cli/cmd_ingest.py).
#
# Движок — внешний репозиторий Orange-hanter/ai-reviewer, ревизия
# закреплена в ops/ai-reviewer-ref и читается из БАЗОВОЙ ветки: код из
# чекаута PR никогда не исполняется с секретами этого прогона. С 0.6.0 пин —
# тег релиза, а не SHA: Rust-бинари качаются из релиза по имени тега, на SHA
# шаг «Download engine binaries» откатывается на deprecated JS-копии. Схема
# повторяет GatewayDemo (.github/workflows/pr-review.yml там же).
#
# Не обязательная проверка: красный вердикт LLM виден в PR, но мерж не
# держит. Сделать блокирующей — добавить `AI code review` в защиту main.
on:
  pull_request:
    types: [opened, ready_for_review, synchronize, reopened]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Номер PR для ручного ревью'
        required: true

# Новый пуш отменяет идущее ревью: токены на гонку не тратим.
concurrency:
  group: pr-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: AI code review
    runs-on: ubuntu-latest
    # LLM-фаза ограничена REVIEW_TIME_BUDGET_MIN=40 ниже. Запас 20 минут — не
    # перестраховка: после дедлайна движок ещё дописывает частичный отчёт
    # (агрегатор, verifier), и на PR #195 (120 файлов, 429 от Ollama Cloud)
    # этот хвост занял больше 9 минут — при 30 минутах джоба убивалась
    # раньше, чем публиковала хоть что-то.
    timeout-minutes: 60
    # Черновики и PR ботов (Dependabot) не ревьюим; ready_for_review возвращает
    # черновик в работу через тип события.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false && github.event.pull_request.user.type != 'Bot')

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Секреты недоступны в `if` уровня джобы, поэтому гейт — шаг. Без ключа
      # LLM или без доступа к движку (PR из форка, секреты не заведены) ревью
      # пропускается зелёным, а не падает «нет ключа».
      - name: Preflight — required secrets
        id: pre
        env:
          HAS_LLM: ${{ secrets.OPENROUTER_API_KEY != '' }}
          HAS_ENGINE_KEY: ${{ secrets.AI_REVIEWER_SSH_KEY != '' }}
        run: |
          if [ "$HAS_LLM" != "true" ] || [ "$HAS_ENGINE_KEY" != "true" ]; then
            echo "→ OPENROUTER_API_KEY / AI_REVIEWER_SSH_KEY не заведены — AI-ревью пропущено"
            echo "ready=0" >> "$GITHUB_OUTPUT"
          else
            echo "ready=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.pre.outputs.ready == '1'
        with:
          node-version: '24'

      # Защита от pwn-request: пин движка читается из базовой ветки. PR,
      # меняющий ops/ai-reviewer-ref, меняет движок только после мержа.
      #
      # Формат пина — `<тег> <sha коммита>`. Тег нужен для URL релиза с
      # бинарями, но он подвижен: у движка нет immutable releases и защиты
      # тегов, перенесённый тег подменил бы код, исполняемый с секретами.
      # Поэтому якорь доверия — SHA: по нему чекаут, к нему привязана
      # attestation бинарей (--source-digest).
      - name: Read pinned engine ref
        id: pin
        if: steps.pre.outputs.ready == '1'
        env:
          BASE_REF: ${{ github.base_ref }}   # через env, не в run: (script injection)
        run: |
          BASE_REF="${BASE_REF:-main}"
          [[ "$BASE_REF" =~ ^[A-Za-z0-9_./-]+$ ]] || { echo "invalid BASE_REF"; exit 1; }
          read -r REF SHA _ < <(git show "origin/$BASE_REF:ops/ai-reviewer-ref" 2>/dev/null || true) || true
          if [ -z "${REF:-}" ]; then
            echo "→ пина нет в origin/$BASE_REF (бутстрап-PR) — ревью пропущено"
            echo "ref=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$REF" =~ ^[A-Za-z0-9_./-]+$ ]] || { echo "invalid engine ref: $REF"; exit 1; }
          [[ "${SHA:-}" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid engine sha: '${SHA:-}' (формат пина: <тег> <sha>)"; exit 1; }
          echo "→ движок ai-reviewer@$REF ($SHA)"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      # Движок был приватным, когда GITHUB_TOKEN этого репозитория его не читал;
      # сейчас он публичный, ключ оставлен на случай возврата видимости.
      # AI_REVIEWER_SSH_KEY — приватная половина read-only deploy key на
      # Orange-hanter/ai-reviewer: ограничен одним репозиторием, писать не может.
      - name: Checkout pinned AI review engine
        if: steps.pin.outputs.ref != ''
        uses: actions/checkout@v7
        with:
          repository: Orange-hanter/ai-reviewer
          ref: ${{ steps.pin.outputs.sha }}
          ssh-key: ${{ secrets.AI_REVIEWER_SSH_KEY }}
          persist-credentials: false
          path: .ai-reviewer-engine

      # Готовые Rust-бинари движка (RFC 20): основная реализация каскада LLM, промптов и гейта.
      # Архив берётся из релиза ТОГО ЖЕ тега, что и движок. Ставится, только если прошёл
      # sha256 (целостность) И build provenance (происхождение): attestation подписана
      # workflow release-binaries репозитория движка, подменённый в релизе архив её не имеет.
      # Пин не тег, релиз без архива, платформа без сборки, нет gh — предупреждение и
      # deprecated JS-копии (инфра-сбой merge не блокирует). Проверка не прошла — бинари не
      # ставятся вовсе: непроверенный код с секретами прогона не исполняется.
      - name: Download engine binaries
        if: steps.pin.outputs.ref != ''
        env:
          REF: ${{ steps.pin.outputs.ref }}   # уже провалидирован шагом pin
          SHA: ${{ steps.pin.outputs.sha }}   # тоже; attestation обязана прийти из этого коммита
          GH_TOKEN: ${{ github.token }}       # gh attestation verify: движок публичный, токена этого репо хватает
        run: |
          set -uo pipefail
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) T=linux-x64 ;;
            Linux-aarch64|Linux-arm64) T=linux-arm64 ;;
            Darwin-arm64) T=darwin-arm64 ;;
            *) echo "::warning::нет готовых бинарей ai-reviewer для $(uname -sm) — движок на JS-копиях"; exit 0 ;;
          esac
          NAME="ai-reviewer-bins-$T.tar.gz"
          URL="https://github.com/Orange-hanter/ai-reviewer/releases/download/$REF"
          D="$RUNNER_TEMP/ai-reviewer-bins"
          mkdir -p "$D"
          if ! curl -fsSL --retry 3 -o "$D/$NAME" "$URL/$NAME" || ! curl -fsSL --retry 3 -o "$D/$NAME.sha256" "$URL/$NAME.sha256"; then
            echo "::warning::архива $NAME для ai-reviewer@$REF нет (пин не тег релиза?) — движок на JS-копиях"
            exit 0
          fi
          if ! (cd "$D" && sha256sum -c "$NAME.sha256"); then
            echo "::error::sha256 архива $NAME не совпал — бинари не установлены, движок на JS-копиях"
            exit 0
          fi
          # gh нужен для проверки provenance. На self-hosted раннере его часто нет — тогда
          # берём пиненную версию из релиза cli/cli, сверенную по sha256, зашитому ЗДЕСЬ
          # (не скачанному рядом). Обновляя GH_VER, обнови и обе суммы.
          GH="$(command -v gh || true)"
          if [ -z "$GH" ]; then
            GH_VER=2.102.0
            case "$T" in
              linux-x64) GH_ARCH=linux_amd64; GH_SHA=bb766f710eef8ede859c18578c72c327597cd4c8a85b06001b1f3843c6019386 ;;
              linux-arm64) GH_ARCH=linux_arm64; GH_SHA=7862c86c72f43df3a2d93ddde6f473285b4e2af61b494849846827e513ef6484 ;;
              *) GH_ARCH= ;;
            esac
            if [ -n "$GH_ARCH" ] \
               && curl -fsSL --retry 3 -o "$D/gh.tar.gz" "https://github.com/cli/cli/releases/download/v$GH_VER/gh_${GH_VER}_${GH_ARCH}.tar.gz" \
               && echo "$GH_SHA  $D/gh.tar.gz" | sha256sum -c - >/dev/null \
               && tar -xzf "$D/gh.tar.gz" -C "$D"; then
              GH="$D/gh_${GH_VER}_${GH_ARCH}/bin/gh"
              echo "→ gh на раннере нет — взят gh $GH_VER из релиза cli/cli (sha256 сверен)"
            fi
          fi
          if [ -z "$GH" ]; then
            echo "::warning::нет gh CLI — provenance архива не проверить, бинари не установлены, движок на JS-копиях"
            exit 0
          fi
          # source-ref: подпись должна прийти из сборки ИМЕННО этого тега. Запуск того же
          # workflow с ветки (с правленым файлом workflow) даёт attestation с ref ветки — отказ.
          # source-digest: и из ИМЕННО того коммита, что в пине. Без него тег, перенесённый
          # на другой коммит с пересобранным релизом, прошёл бы проверку.
          if ! "$GH" attestation verify "$D/$NAME" --repo Orange-hanter/ai-reviewer \
               --signer-workflow Orange-hanter/ai-reviewer/.github/workflows/release-binaries.yml \
               --source-ref "refs/tags/$REF" --source-digest "$SHA" --deny-self-hosted-runners; then
            echo "::error::provenance архива $NAME не подтверждена — бинари не установлены, движок на JS-копиях"
            exit 0
          fi
          mkdir -p .ai-reviewer-engine/rust/bin
          tar -xzf "$D/$NAME" -C .ai-reviewer-engine/rust/bin
          echo "→ бинари ai-reviewer@$REF ($T) установлены"

      # Граф кода для blast radius: движок читает .graphify/graphify-out/graph.json
      # и зовёт `.graphify/gf affected <символ>` (ai-reviewer lib/config.mjs).
      # Без графа blast radius молча выключается (`skip_reason: graph_missing`) —
      # так и было до этого шага. Строим на чекауте PR (merge-коммит): свежесть
      # движок сверяет по «Built from commit» в GRAPH_REPORT.md с HEAD.
      # graphify только парсит AST (без LLM и без исполнения кода PR), секретов
      # у шага нет. Fail-open: сбой графа не должен ронять ревью.
      #
      # Ничего исполняемого из дерева PR: бинарь живёт в $RUNNER_TEMP и уходит
      # движку абсолютным путём (GRAPHIFY_BIN), иначе закоммиченный в PR
      # `.graphify/gf` исполнился бы в шаге с секретами. uv не читает конфиг
      # репо (UV_NO_CONFIG: [tool.uv] в pyproject.toml / uv.toml подменил бы
      # индекс), зависимости — по хэшам из ops/graphify-requirements.txt
      # БАЗОВОЙ ветки (как ops/ai-reviewer-ref выше), только колёса — без
      # build-хуков sdist. PR, меняющий требования, меняет граф после мержа.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        if: steps.pin.outputs.ref != ''
        continue-on-error: true
        with:
          python-version: "3.13"

      # До восстановления кэша: иначе rm снёс бы восстановленное.
      - name: Drop PR-supplied .graphify
        if: steps.pin.outputs.ref != ''
        run: rm -rf .graphify

      - name: Read pinned graphify requirements
        id: gfreq
        if: steps.pin.outputs.ref != ''
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref }}   # через env, не в run: (script injection)
        run: |
          BASE_REF="${BASE_REF:-main}"
          [[ "$BASE_REF" =~ ^[A-Za-z0-9_./-]+$ ]] || { echo "invalid BASE_REF"; exit 1; }
          REQ="$RUNNER_TEMP/graphify-requirements.txt"
          if ! git show "origin/$BASE_REF:ops/graphify-requirements.txt" > "$REQ" 2>/dev/null; then
            echo "→ требований graphify нет в origin/$BASE_REF (бутстрап-PR) — граф пропущен"
            exit 0
          fi
          echo "req=$REQ" >> "$GITHUB_OUTPUT"
          echo "key=$(sha256sum "$REQ" | cut -c1-16)" >> "$GITHUB_OUTPUT"

      # AST-кэш graphify ключуется sha256 содержимого файла — переносим между
      # прогонами только его; stat-index.json (mtime-ярлык) после чекаута бесполезен.
      # Кэш — JSON (не pickle): отравленный кэш портит граф, но кода не исполняет.
      - name: Restore graphify AST cache
        if: steps.gfreq.outputs.req != ''
        continue-on-error: true
        uses: actions/cache@v6
        with:
          path: .graphify/graphify-out/cache/ast
          key: graphify-${{ steps.gfreq.outputs.key }}-${{ github.sha }}
          restore-keys: graphify-${{ steps.gfreq.outputs.key }}-

      - name: Build graphify graph
        if: steps.gfreq.outputs.req != ''
        continue-on-error: true
        timeout-minutes: 5
        env:
          GRAPHIFY_OUT: .graphify/graphify-out
          GRAPHIFY_NO_TIPS: '1'
          UV_NO_CONFIG: '1'
          REQ: ${{ steps.gfreq.outputs.req }}
        run: |
          TOOLS="$RUNNER_TEMP/graphify"
          uv venv -q "$TOOLS/venv"
          uv pip install -q --require-hashes --only-binary :all: \
            --index-url https://pypi.org/simple \
            --python "$TOOLS/venv/bin/python" -r "$REQ"
          "$TOOLS/venv/bin/graphify" update . --force
          grep -m1 'Built from commit' .graphify/graphify-out/GRAPH_REPORT.md

      # Без continue-on-error: скрипт выходит с 1 только на мерж-гейте
      # (подтверждённые critical/major), инфраструктурные сбои — fail-open.
      # Профиль — .ai-reviewer.json в корне, движок находит его сам.
      - name: Run AI review
        if: steps.pin.outputs.ref != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          # Провайдер — OpenRouter, не Ollama Cloud: недельный лимит Ollama
          # обнулял ревью целиком (все вызовы 429 «weekly usage limit»).
          # LLM_* у движка приоритетнее OLLAMA_*. У ключа есть лимит трат —
          # кончится, движок пометит в sticky «квота провайдера исчерпана» (402).
          LLM_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LLM_BASE_URL: https://openrouter.ai/api/v1
          # Абсолютный путь вне чекаута даже при упавшей сборке графа: дефолт
          # движка `.graphify/gf` указывает в дерево PR.
          GRAPHIFY_BIN: ${{ runner.temp }}/graphify/venv/bin/graphify
          REVIEW_MODE: moa
          # Тот же ростер, что был на Ollama, в slug'ах OpenRouter (с префиксом
          # вендора). Каталог — https://openrouter.ai/api/v1/models.
          MOA_REFERENCE_MODELS: moonshotai/kimi-k2.7-code,z-ai/glm-5.2,deepseek/deepseek-v4.1-flash
          MOA_SPECIALIST_MODELS: security:deepseek/deepseek-v4.1-flash,correctness:moonshotai/kimi-k2.7-code,architecture:z-ai/glm-5.2
          MOA_AGGREGATOR: minimax/minimax-m3
          OLLAMA_MODELS_FALLBACK: deepseek/deepseek-v4.1-flash
          # kimi-k2.7-code на OpenRouter отвечает на effort=none 400 «Reasoning
          # is mandatory»; каскад движка сам повторит на low, но это лишний
          # вызов на каждый запрос — сразу low.
          LLM_MODEL_SETTINGS: '{"moonshotai/kimi-k2.7-code":{"effort":"low"}}'
          REVIEW_BLOCK_ON: critical,major
          REVIEW_BLOCK_SINGLE: critical
          REVIEW_CONFIDENCE_MIN: '0.8'
          REVIEW_VERIFIER: '1'
          REVIEW_VERIFIER_MODEL: deepseek/deepseek-v4-pro
          REVIEW_VERIFIER_STRICT: '1'
          # eslint/ast-grep prescan видит только JS/TS; cod-doc — Python.
          REVIEW_PRESCAN: '0'
          REVIEW_EXPORT: '1'
          REVIEW_TIME_BUDGET_MIN: '40'  # дедлайн LLM; timeout-minutes выше — с запасом на хвост
        run: node .ai-reviewer-engine/bin/pr-review.mjs

      # Имя артефакта — контракт с cod_doc/cli/cmd_ingest.py (`pr-review-export-<PR>`).
      # У GatewayDemo оно другое (`ai-review-export-*`) — не копировать оттуда.
      - name: Upload review export
        if: always() && steps.pin.outputs.ref != ''
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: pr-review-export-${{ github.event.pull_request.number || inputs.pr_number }}
          path: .ai-review/export/
          if-no-files-found: ignore
          retention-days: 30
