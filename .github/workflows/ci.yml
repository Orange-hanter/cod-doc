name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Отменяем только устаревшие прогоны PR. Прогон main доводим до конца: два
# мержа подряд иначе гасили первый, и коммит на main оставался без вердикта
# CI вовсе.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# `fetch-depth: 0` во всех checkout-шагах — не перестраховка. Версия пакета
# выводится из git через setuptools-scm, а `actions/checkout` по умолчанию
# клонирует глубиной 1 и без тегов: сборка называла бы себя `0.1.dev<N>`
# вместо ревизии, и `cod-doc --version` в образе врал бы.
#
# Окружение — `uv sync --frozen` из закоммиченного `uv.lock`, а не
# `pip install .[dev]`. Без лока pip ставил свежайшие версии всего, что
# разрешают нижние границы в pyproject, и CI расходился с локальным venv сам
# собой (ADO-070: 10×RUF036 приехали правилом, которого не было локально).
# `--frozen` падает, если лок не соответствует pyproject, а не пересчитывает
# его молча. Обновление лока — PR от Dependabot или `uv lock --upgrade`.
# `activate-environment` кладёт `.venv/bin` в PATH следующих шагов, поэтому
# команды ниже зовутся как есть; тот же `.venv/bin/alembic` ищут тесты.

jobs:

  # ── Lint & Format ──────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # теги нужны setuptools-scm, см. комментарий выше
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.13"
          activate-environment: true
      - run: uv sync --frozen --extra dev
      - run: ruff check cod_doc/ tests/
      - run: ruff format --check cod_doc/ tests/

  # ── Type Check ─────────────────────────────────────────────────────────────
  typecheck:
    name: Typecheck (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # теги нужны setuptools-scm, см. комментарий выше
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.13"
          activate-environment: true
      - run: uv sync --frozen --extra dev
      - run: mypy cod_doc/

  # ── Tests (matrix across supported Python versions) ────────────────────────
  test:
    name: "Test py${{ matrix.python }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ADO-097: одна поддерживаемая версия — 3.11/3.12 сняты с поддержки
        # 2026-09-07; две джобы по ~14 минут уходили на версии, которые
        # `requires-python = ">=3.13"` больше не допускает.
        python: ["3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # теги нужны setuptools-scm, см. комментарий выше
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true
      - run: uv sync --frozen --extra dev
      # ADO-070: 25, а не 10. Полный прогон занимал ~11 минут, и джоба
      # убивалась таймаутом на 64% тестов — pytest даже не успевал напечатать
      # сводку с трейсбеками. Раньше это было незаметно: джоба падала на
      # alembic за полторы минуты и до таймаута не доживала.
      #
      # `-n auto --dist loadfile`: прогон распараллелен по числу ядер раннера.
      # `loadfile`, а не дефолтный `load`, — тесты делят внутрипроцессные
      # глобалы (каталог тулов `mcp._tool_manager._tools`, состояние API в
      # autouse-фикстуре `tests/conftest.py`), и файл целиком на одном воркере
      # сохраняет ту же последовательность вызовов, что и обычный прогон.
      # Разница по времени с `load` — в пределах 8%, платить за неё
      # чувствительностью к порядку незачем.
      #
      # `-q`, а не `-v`: `-v` печатал ~3800 строк PASSED, среди которых
      # приходилось искать упавший тест. Трейсбеки и сводка FAILED от `-q`
      # не зависят.
      - run: pytest tests/ -n auto --dist loadfile -q --tb=short --timeout=120
        timeout-minutes: 25
        env:
          COD_DOC_API_KEY: ${{ secrets.COD_DOC_TEST_API_KEY || 'sk-test-placeholder' }}
          COD_DOC_AUTO_COMMIT: "false"

  # ── Web routes drift (advisory, ADO-012) ─────────────────────────────────
  web-routes:
    name: Web routes drift (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true # advisory — дрейф роутов не блокирует CI (ADO-011/012)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # теги нужны setuptools-scm, см. комментарий выше
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.13"
          activate-environment: true
      - run: uv sync --frozen
      # Аудит читает capabilities/web-frontend.md §3 с диска и сравнивает с
      # живыми роутами из routers; БД/импорт не нужны, только реестр проекта.
      - run: cod-doc project add . --name cod-doc
      - run: cod-doc audit --web-routes -p cod-doc

  # ── Zsh completion ────────────────────────────────────────────────────────
  zsh-completion:
    name: Zsh completion (drift + syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # теги нужны setuptools-scm, см. комментарий выше
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.13"
          activate-environment: true
      # Ставим zsh ЯВНО: тест синтаксиса помечен skipif(which("zsh") is None),
      # и на runner'е без zsh он молча пропустится — то есть гейт, ради
      # которого он написан, тихо исчезнет. Отдельная job, чтобы не вешать
      # apt на десятиминутную `test`.
      # sqlite3 тоже явно: runtime-тесты гоняют prelude настоящим zsh, а он
      # без CLI-бинарника честно уходит в тихий `return 1` — тест бы упал не
      # на регрессии, а на составе образа.
      - run: sudo apt-get update && sudo apt-get install -y zsh sqlite3
      - run: uv sync --frozen --extra dev
      - run: python -m cod_doc.cli.completion --check
      - run: zsh -n cod_doc/cli/completion/_cod-doc
      - run: zsh -n cod_doc/cli/completion/prelude.zsh
      - run: pytest tests/cli/ -q -k zsh_completion --tb=short

  # ── Docker Build (smoke test) ─────────────────────────────────────────────
  # Без `needs:`: образ собирается из исходников и не зависит от вердикта
  # lint/typecheck/test. С зависимостью его ~75 секунд прибавлялись к хвосту
  # каждого прогона; блокирует мерж он и так — как обязательная проверка.
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # теги нужны setuptools-scm, см. комментарий выше
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: cod-doc:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run --rm -d --name cod-doc-ci -p 8765:8765 \
            -e COD_DOC_API_KEY=sk-test-placeholder \
            -e COD_DOC_AUTO_COMMIT=false \
            cod-doc:ci
          sleep 10
          curl -f http://localhost:8765/api/health || (docker logs cod-doc-ci && exit 1)
          docker stop cod-doc-ci
