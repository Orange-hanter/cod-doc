name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Lint & Format ──────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check cod_doc/ tests/
      - run: ruff format --check cod_doc/ tests/

  # ── Type Check ─────────────────────────────────────────────────────────────
  typecheck:
    name: Typecheck (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .[dev]
      - run: mypy cod_doc/

  # ── Tests (matrix across supported Python versions) ────────────────────────
  test:
    name: "Test py${{ matrix.python }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install .[dev]
      - run: pytest tests/ -v --tb=short --timeout=120
        timeout-minutes: 10
        env:
          COD_DOC_API_KEY: ${{ secrets.COD_DOC_TEST_API_KEY || 'sk-test-placeholder' }}
          COD_DOC_AUTO_COMMIT: "false"

  # ── Web routes drift (advisory, ADO-012) ─────────────────────────────────
  web-routes:
    name: Web routes drift (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true # advisory — дрейф роутов не блокирует CI (ADO-011/012)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      # Аудит читает capabilities/web-frontend.md §3 с диска и сравнивает с
      # живыми роутами из routers; БД/импорт не нужны, только реестр проекта.
      - run: cod-doc project add . --name cod-doc
      - run: cod-doc audit --web-routes -p cod-doc

  # ── Docker Build (smoke test) ─────────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: cod-doc:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run --rm -d --name cod-doc-ci -p 8765:8765 \
            -e COD_DOC_API_KEY=sk-test-placeholder \
            -e COD_DOC_AUTO_COMMIT=false \
            cod-doc:ci
          sleep 10
          curl -f http://localhost:8765/api/health || (docker logs cod-doc-ci && exit 1)
          docker stop cod-doc-ci
